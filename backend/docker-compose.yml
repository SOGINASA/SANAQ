services:
  backend:
    build:
      context: .
    container_name: sanaq-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:////app/database/sanaq.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTO_CREATE_DB: "true"
      SEED_DEMO_DATA: "true"
      JWT_COOKIE_SECURE: "false"
      AI_PROVIDER: ollama
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_THINKING: ${AI_THINKING:-false}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
