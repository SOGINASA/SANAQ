services:
  backend:
    build:
      context: .
    container_name: sanaq-backend
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in backend/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in backend/.env}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/database/sanaq.db}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in backend/.env}
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-false}
      MIGRATE_RUNTIME_SCHEMA: ${MIGRATE_RUNTIME_SCHEMA:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      DATA_MODE: ${DATA_MODE:-production}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      AI_PROVIDER: groq
      AI_BASE_URL: https://api.groq.com/openai/v1
      AI_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in backend/.env}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-sana-tutor-v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-500}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-20000}
      PATHNET_MODE: ${PATHNET_MODE:-shadow}
      PATHNET_MODEL_PATH: /app/ml/artifacts/pathnet-v2-outcomes-notebook.pt
      PATHNET_TOP_K: ${PATHNET_TOP_K:-20}
      PATHNET_CANARY_PERCENT: ${PATHNET_CANARY_PERCENT:-0}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
