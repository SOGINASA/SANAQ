name: sanaq

services:
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api/v1
        REACT_APP_AI_STREAM_URL: /api/v1
        REACT_APP_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
        REACT_APP_ENABLE_MOCKS: "false"
        REACT_APP_SHOW_DEMO_LOGIN: "false"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public

  backend:
    image: sanaq-backend:latest
    build:
      context: ./backend
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.11.0}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://sanaq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sanaq
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-SANAQ}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_ORIGIN:-http://localhost}/api/v1/auth/google/callback
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-true}
      MIGRATE_RUNTIME_SCHEMA: ${MIGRATE_RUNTIME_SCHEMA:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DATA_MODE: ${DATA_MODE:-production}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      SESSION_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      AI_PROVIDER: groq
      AI_BASE_URL: https://api.groq.com/openai/v1
      AI_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      AI_PROMPT_VERSION: sana-tutor-v1
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-500}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-20000}
      PATHNET_MODE: ${PATHNET_MODE:-shadow}
      PATHNET_MODEL_PATH: /app/ml/artifacts/pathnet-v2-outcomes-notebook.pt
      PATHNET_TOP_K: ${PATHNET_TOP_K:-20}
      PATHNET_CANARY_PERCENT: ${PATHNET_CANARY_PERCENT:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public
      - private

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanaq
      POSTGRES_USER: sanaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanaq -d sanaq"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

volumes:
  postgres_data:

networks:
  public:
  private:
